<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bouncing Box</title>
    <script src="jquery.min.js">
    </script>
    <style>
      .box {
        width:100px;
        height: 100px;
        background-color: teal;
        font-size: 300%;
        text-align: center;
        user-select: none;
        display: block;
        background-image: url(https://static.vecteezy.com/system/resources/thumbnails/081/861/610/small/mondrian-style-geometric-grid-with-red-blue-yellow-and-white-rectangles-abstract-pattern-vector.jpg);
        position: absolute;
        top: 100px;
        /* Change me! */
        left: 0px;
      }
      
      .text {
        font-size: 110%;
        font-style: italic;
        font-family: "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        font-size: clamp(2rem, 8vw, 3rem);
        line-height: 0.9;
        font-weight: 900;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        color: white;
      -webkit-text-stroke-width: 2px;
      -webkit-text-stroke-color: black;
      }
      .board {
        height: 100vh;
        background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5GqZMx5I5bxm4F7OTttr7eNyvMpaw0CqoaP841Qa8bWXHx650MOZGEUG5&s=10)


      }
    </style>
    <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
  </head>

  <body class="board">
    <!-- HTML for the box -->
  <div class="box">?</div>
  <p class="text"> hi! welcome to bouncing box (by hammy, duh) </p>
  <p class="text"> don't misclick >10 times, or else </p>

    <script>
      (function () {
        "use strict";
        /* global jQuery */

        //////////////////////////////////////////////////////////////////
        /////////////////// SETUP DO NOT DELETE //////////////////////////
        //////////////////////////////////////////////////////////////////

        var box = jQuery(".box"); // reference to the HTML .box element
        var board = jQuery(".board"); // reference to the HTML .board element
        var boardWidth = board.width(); // the maximum X-Coordinate of the screen
        var boardHeight = jQuery(window).height()

        // update the boardWidth variable when the window is resized
        jQuery(window).on("resize", function () {
          boardWidth = board.width();
        });

        // Every 50 milliseconds, call the update Function (see below)
        var interval = setInterval(update, 50);

        function endGame() {
         clearInterval(interval);
}
        // Every time the box is clicked, call the handleBoxClick Function (see below)
        box.on("click", handleBoxClick);

        // moves the Box to a new position on the screen along the X-Axis
        function moveBoxTo(newPositionX, newPositionY) {
          box.css("left", newPositionX)
          box.css("top", newPositionY)
        }

        // changes the text displayed on the Box
        function changeBoxText(newText) {
          box.text(newText);
        }

        //////////////////////////////////////////////////////////////////
        /////////////////// YOUR CODE BELOW HERE /////////////////////////
        //////////////////////////////////////////////////////////////////

        // TODO 2 - Variable declarations
        var positionX = 100
        var points = 0
        var speed = 5
        var positionY = 100
        var speedY = 10
        var misclick = 0 
        





        /**
         * This Function will be called 20 times/second.
         * Each time it is called, it should move the Box to a new location.
         * If the box drifts off the screen, turn it around!
         */
        function update() {
        moveBoxTo(positionX, positionY)
        positionX += speed
        positionY += speedY
        if (positionX > boardWidth) {
          speed *= -1
        }
        if (positionX < 0){
          speed *= -1
        }
        if (positionY > boardHeight){
          speedY *= -1
        }

        if (positionY < 0){
          speedY *= -1
        }

      }
        /**
         * This Function will be called each time the box is clicked.
         * Each time it is called, it should perform each of the following actions:
         * - increase the points total
         * - increase the speed
         * - move the box to the left side of the screen.
         */
        function handleBoxClick() {
        if (points%3 == 0){
          speed = 3 * points + 10
        }      
        var randNum = Math.random() * 0.75*boardWidth;
        positionX = randNum
        positionY = randNum
        points++
        changeBoxText(points)
        }


        })();
    </script>
  </body>
</html>
